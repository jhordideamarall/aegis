<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#080808;min-height:100vh;display:flex;align-items:center;justify-content:center}
  #root{width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
  #phone-wrap{transform-origin:center center}
  .ns::-webkit-scrollbar{display:none}
  .ns{-ms-overflow-style:none;scrollbar-width:none}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{from{opacity:0;transform:scale(0.84)}to{opacity:1;transform:scale(1)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
  @keyframes slashDrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .u{animation:up 0.28s cubic-bezier(0.22,1,0.36,1) both}
  .p{animation:pop 0.24s cubic-bezier(0.34,1.56,0.64,1) both}
  .f{animation:fade 0.18s ease both}
  .su{animation:slideUp 0.28s cubic-bezier(0.22,1,0.36,1) both}
  .sd{animation:slashDrop 0.18s cubic-bezier(0.22,1,0.36,1) both}
  .tap:active{opacity:.62;transform:scale(.95);transition:all .07s}
  .glass-nav{
    position:absolute;bottom:0;left:0;right:0;z-index:10;
    background:rgba(13,13,13,0.78)!important;
    backdrop-filter:blur(28px) saturate(160%)!important;
    -webkit-backdrop-filter:blur(28px) saturate(160%)!important;
    border-top:1px solid rgba(255,255,255,0.08)!important;
  }
  .glass-header{
    background:rgba(13,13,13,0)!important;
    backdrop-filter:blur(0px)!important;
    -webkit-backdrop-filter:blur(0px)!important;
    transition:backdrop-filter 0.3s,background 0.3s,-webkit-backdrop-filter 0.3s!important;
  }
  .glass-header.scrolled{
    background:rgba(13,13,13,0.82)!important;
    backdrop-filter:blur(24px) saturate(150%)!important;
    -webkit-backdrop-filter:blur(24px) saturate(150%)!important;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  @keyframes shimmer{0%,100%{opacity:0.35}50%{opacity:0.7}}
  .sk{animation:shimmer 1.4s ease infinite;background:rgba(255,255,255,0.06);border-radius:8px}
  .dot1,.dot2,.dot3{width:5px;height:5px;border-radius:50%;display:inline-block;background:#555;animation:blink 1.2s infinite}
  .dot2{animation-delay:.2s}.dot3{animation-delay:.4s}
</style>
</head>

function Avatar({label,uid,size=46,radius=10}) {
  const id='av'+uid;
  const initials=label.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  return (

function WheelPicker({items,value,onChange,width=54}) {
  const ref=React.useRef(null);
  const IH=40,PAD=IH;
  React.useEffect(()=>{
    const idx=items.findIndex(i=>i.v==value);
    if(ref.current&&idx>=0) ref.current.scrollTop=idx*IH;
  },[]);
  const onScroll=()=>{
    if(!ref.current)return;
    const idx=Math.round(ref.current.scrollTop/IH);
    const c=Math.max(0,Math.min(items.length-1,idx));
    if(items[c]&&items[c].v!=value) onChange(items[c].v);
  };
  return(
    <div style={{position:'relative',width,overflow:'hidden',height:IH*3,flexShrink:0}}>
      <div style={{position:'absolute',top:0,left:0,right:0,height:PAD,background:`linear-gradient(to bottom,${T.surface} 20%,transparent)`,zIndex:2,pointerEvents:'none'}}/>
      <div style={{position:'absolute',bottom:0,left:0,right:0,height:PAD,background:`linear-gradient(to top,${T.surface} 20%,transparent)`,zIndex:2,pointerEvents:'none'}}/>
      <div style={{position:'absolute',top:PAD,left:0,right:0,height:IH,borderTop:'1px solid rgba(255,255,255,0.1)',borderBottom:'1px solid rgba(255,255,255,0.1)',pointerEvents:'none',zIndex:1}}/>
      <div ref={ref} onScroll={onScroll} style={{height:'100%',overflowY:'scroll',scrollSnapType:'y mandatory',paddingTop:PAD,paddingBottom:PAD,WebkitOverflowScrolling:'touch',scrollbarWidth:'none',msOverflowStyle:'none'}} className="ns">

            {item.l}

    </div>

}

// ── POS ───────────────────────────────────────────────────────────────────────
function POSScreen({onTab}) {
  const [loading,setLoading]=useState(true);
  useEffect(()=>{const t=setTimeout(()=>setLoading(false),1100);return()=>clearTimeout(t);},[]);
  const [cart,setCart]=useState([]);
  const [screen,setScreen]=useState('products');
  const [search,setSearch]=useState('');
  const [cat,setCat]=useState('Semua');

  const filtered=useMemo(()=>PRODUCTS.filter(p=>(cat==='Semua'||p.cat===cat)&&p.name.toLowerCase().includes(search.toLowerCase())),[cat,search]);
  const inCart=p=>cart.find(i=>i.product.id===p.id);
  const addToCart=p=>{
    if(p.stock<=0)return;
    setCart(prev=>{const ex=prev.find(i=>i.product.id===p.id);if(ex)return prev.map(i=>i.product.id===p.id?{...i,qty:i.qty+1}:i);return[...prev,{product:p,qty:1}];});
  };
  const updateQty=(id,qty)=>{
    if(qty<=0)setCart(prev=>prev.filter(i=>i.product.id!==id));
    else setCart(prev=>prev.map(i=>i.product.id===id?{...i,qty}:i));
  };
  const cartCount=cart.reduce((s,i)=>s+i.qty,0);
  const cartTotal=cart.reduce((s,i)=>s+i.product.price*i.qty,0);

  if(screen==='cart')return <CartScreen cart={cart} setCart={setCart} cartTotal={cartTotal} onBack={()=>setScreen('products')} onPayment={()=>setScreen('payment')} onTab={onTab}/>;
  if(screen==='payment')return <PaymentScreen cart={cart} setCart={setCart} cartTotal={cartTotal} onBack={()=>setScreen('cart')} onDone={()=>{setCart([]);setScreen('products');onTab('orders');}} onTab={onTab}/>;

  const tagC=tag=>tag==='Baru'?T.indigo:tag==='Fresh'?T.green:T.amber;
  const tagBg=tag=>tag==='Baru'?'rgba(129,140,248,0.12)':tag==='Fresh'?'rgba(34,197,94,0.12)':'rgba(245,158,11,0.12)';

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:T.bg,position:'relative'}}>
      {/* Header */}
      <div style={{padding:'60px 18px 0',flexShrink:0}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div style={{display:'flex',alignItems:'baseline',gap:8}}>
            <div>
              <div style={{fontSize:22,fontWeight:900,color:T.fg,letterSpacing:'-0.03em'}}>Point of Sale</div>
              <div style={{fontSize:9,fontWeight:800,color:T.muted,textTransform:'uppercase',letterSpacing:'0.14em',marginTop:1}}>Ready to Sell</div>
            </div>
            <div style={{fontSize:10,fontWeight:700,color:T.muted}}>{filtered.length} item</div>
          </div>
          <button onClick={()=>cartCount>0&&setScreen('cart')} style={{position:'relative',width:40,height:40,borderRadius:11,background:cartCount>0?T.fg:T.surface,border:'none',cursor:cartCount>0?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center'}} className="tap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={cartCount>0?T.bg:T.muted} strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            {cartCount>0&&<span style={{position:'absolute',top:-4,right:-4,background:T.red,color:'#fff',fontSize:9,fontWeight:900,minWidth:16,height:16,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px',border:`2px solid ${T.bg}`}} className="p">{cartCount}</span>}
          </button>
        </div>
        {/* Search */}
        <div style={{position:'relative',marginBottom:12}}>
          <svg width="13" height="13" style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)'}} viewBox="0 0 24 24" fill="none" stroke={T.muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Cari produk…" value={search} onChange={e=>{setSearch(e.target.value);}}
            style={{width:'100%',height:38,borderRadius:10,border:`1px solid ${T.border}`,background:T.surface,paddingLeft:34,paddingRight:12,fontSize:12,fontWeight:600,color:T.fg,outline:'none'}}/>
        </div>
        {/* Category Pills - dari data produk aktual */}
        <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:12}} className="ns">
          {CATS.map(c=>
            <button key={c} onClick={()=>setCat(c)} style={{flexShrink:0,height:28,padding:'0 12px',borderRadius:7,border:`1px solid ${cat===c?T.fg:T.border}`,background:cat===c?T.fg:'transparent',color:cat===c?T.bg:T.muted,fontSize:10,fontWeight:800,letterSpacing:'0.07em',textTransform:'uppercase',cursor:'pointer',transition:'all 0.15s'}} className="tap">{c}</button>
          )}
        </div>
      </div>
      {/* Product List — scroll semua, no pagination */}
      <div style={{flex:1,overflowY:'auto',padding:'0 18px 172px'}} className="ns">
        {loading
          ?<div style={{display:'flex',flexDirection:'column'}}>{[0,1,2,3,4].map(i=><div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:`1px solid ${T.border}`}}><div className="sk" style={{width:44,height:44,borderRadius:12,flexShrink:0}}/><div style={{flex:1,display:'flex',flexDirection:'column',gap:7}}><Sk w="55%" h={13}/><Sk w="35%" h={11}/><Sk w="25%" h={10}/></div><div className="sk" style={{width:30,height:30,borderRadius:9,flexShrink:0}}/></div>)}</div>
          :filtered.length===0
          ?<EmptyState icon={<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke={T.muted} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>} title="Produk tidak ditemukan" sub="Coba kata kunci lain atau ubah kategori"/>

          :<div style={{display:'flex',flexDirection:'column'}}>
            {filtered.map((p,i)=>{
              const qty=inCart(p)?.qty||0;const oos=p.stock<=0;
              return (
                <div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',minHeight:72,borderBottom:`1px solid ${T.border}`,opacity:oos?.38:1,animationDelay:`${i*22}ms`}} className="u">
                  <Avatar label={p.name} uid={p.id} size={46} radius={10}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:4}}>
                      <span style={{fontSize:13,fontWeight:700,color:T.fg,lineHeight:'18px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:110}}>{p.name}</span>
                      {p.tag&&<span style={{fontSize:8,fontWeight:900,letterSpacing:'0.1em',color:tagC(p.tag),background:tagBg(p.tag),padding:'2px 6px',borderRadius:4,textTransform:'uppercase',flexShrink:0}}>{p.tag}</span>}
                    </div>
                    <div style={{fontSize:12,fontWeight:800,color:T.fg,marginBottom:2}}>{fmt(p.price)}</div>
                    <div style={{fontSize:10,fontWeight:600,color:p.stock<=5&&!oos?T.red:T.muted}}>{oos?'Out of Stock':`${p.stock} in stock`}</div>
                  </div>
                  {qty>0
                    ?<div style={{display:'flex',alignItems:'center',gap:2,background:T.surface,borderRadius:9,padding:3,flexShrink:0}}>
                        <button onClick={()=>updateQty(p.id,qty-1)} style={{width:26,height:26,borderRadius:7,border:'none',background:'transparent',cursor:'pointer',color:T.muted,fontSize:16,fontWeight:900,display:'flex',alignItems:'center',justifyContent:'center'}} className="tap">−</button>
                        <span style={{width:22,textAlign:'center',fontSize:12,fontWeight:900,color:T.fg}}>{qty}</span>
                        <button onClick={()=>!oos&&addToCart(p)} style={{width:26,height:26,borderRadius:7,border:'none',background:T.fg,cursor:'pointer',color:T.bg,fontSize:16,fontWeight:900,display:'flex',alignItems:'center',justifyContent:'center'}} className="tap">+</button>
                      </div>
                    :<button onClick={()=>addToCart(p)} disabled={oos} style={{width:30,height:30,borderRadius:9,border:`1px solid ${T.border}`,background:'transparent',color:T.muted,display:'flex',alignItems:'center',justifyContent:'center',cursor:oos?'not-allowed':'pointer',fontSize:18,fontWeight:300,flexShrink:0}} className="tap">+</button>
                  }
                </div>
              );
            })}
          </div>
        }
        <div style={{height:8}}/>
      </div>
      {cartCount>0&&
        <div onClick={()=>setScreen('cart')} style={{position:'absolute',bottom:108,left:18,right:18,zIndex:11,borderRadius:14,background:T.fg,padding:'14px 18px',display:'flex',alignItems:'center',cursor:'pointer',boxShadow:'0 4px 24px rgba(0,0,0,0.4)'}} className="tap su">
          <span style={{width:26,height:26,borderRadius:7,background:T.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:900,color:T.fg,flexShrink:0}}>{cartCount}</span>
          <span style={{flex:1,fontSize:11,fontWeight:900,color:T.bg,textAlign:'center',letterSpacing:'0.1em',textTransform:'uppercase'}}>View Cart</span>
          <span style={{fontSize:12,fontWeight:900,color:T.bg}}>{fmt(cartTotal)}</span>
        </div>
      }
      <BottomNav active="pos" onTab={onTab}/>
    </div>
  );
}

// ── CART ──────────────────────────────────────────────────────────────────────
function CartScreen({cart,setCart,cartTotal,onBack,onPayment,onTab}) {
  const [memberSearch,setMemberSearch]=useState('');
  const [selectedMember,setSelectedMember]=useState(null);
  const [showMemberDrop,setShowMemberDrop]=useState(false);
  const [redeemPoints,setRedeemPoints]=useState(false);

  const updateQty=(id,qty)=>{
    if(qty<=0)setCart(prev=>prev.filter(i=>i.product.id!==id));
    else setCart(prev=>prev.map(i=>i.product.id===id?{...i,qty}:i));
  };

  const filteredMembers=MEMBERS.filter(m=>m.name.toLowerCase().includes(memberSearch.toLowerCase())||m.phone.includes(memberSearch));

  // Charges dari settings nyata
  const subtotal=cartTotal;
  const pointsDiscount=redeemPoints&&selectedMember?Math.min(Math.floor(subtotal/CHARGES.points_redeem_rate)*CHARGES.points_redeem_rate,selectedMember.points*CHARGES.points_redeem_rate):0;
  const taxBase=Math.max(subtotal-pointsDiscount,0);
  const tax=CHARGES.tax_enabled?Math.round(taxBase*CHARGES.tax_rate/100):0;
  const service=CHARGES.service_enabled?Math.round(taxBase*CHARGES.service_rate/100):0;
  const total=taxBase+tax+service;

  // Earn points setelah transaksi
  const earnPoints=Math.floor(total/CHARGES.points_earn_rate);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:T.bg}}>
      <div style={{padding:'60px 18px 14px',flexShrink:0,display:'flex',alignItems:'center',gap:12}}>
        <BackBtn onPress={onBack}/>
        <div style={{flex:1}}>
          <div style={{fontSize:20,fontWeight:900,color:T.fg,letterSpacing:'-0.03em'}}>Cart</div>
        </div>
        {cart.length>0&&<button onClick={()=>setCart([])} style={{fontSize:10,fontWeight:800,color:T.red,background:'none',border:'none',cursor:'pointer',letterSpacing:'0.1em',textTransform:'uppercase'}} className="tap">Clear All</button>}
      </div>

      {/* Member Selector — MemberCombobox dari sistem nyata */}
      <div style={{padding:'0 18px 12px',flexShrink:0,position:'relative'}}>
        <div style={{fontSize:9,fontWeight:800,color:T.muted,letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:6}}>Customer</div>
        {selectedMember
          ?<div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:12,border:`1px solid rgba(34,197,94,0.25)`,background:'rgba(34,197,94,0.06)'}}>
              <div style={{width:32,height:32,borderRadius:8,background:'rgba(34,197,94,0.1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={T.green} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:700,color:T.fg}}>{selectedMember.name}</div>
                <div style={{fontSize:10,color:T.muted,fontWeight:600}}>{selectedMember.points.toLocaleString()} poin · {selectedMember.phone}</div>
              </div>
              <button onClick={()=>{setSelectedMember(null);setRedeemPoints(false);}} style={{fontSize:10,fontWeight:800,color:T.muted,background:'none',border:'none',cursor:'pointer'}} className="tap">×</button>
            </div>
          :<div>
            <div style={{position:'relative'}}>
              <svg width="13" height="13" style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)'}} viewBox="0 0 24 24" fill="none" stroke={T.muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input placeholder="Cari member atau buat baru…" value={memberSearch} onChange={e=>{setMemberSearch(e.target.value);setShowMemberDrop(true);}} onFocus={()=>setShowMemberDrop(true)}
                style={{width:'100%',height:38,borderRadius:10,border:`1px solid ${T.border}`,background:T.surface,paddingLeft:34,paddingRight:12,fontSize:12,fontWeight:600,color:T.fg,outline:'none'}}/>
            </div>
            {showMemberDrop&&memberSearch&&
              <div style={{position:'absolute',left:18,right:18,background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,marginTop:4,zIndex:20,overflow:'hidden',boxShadow:'0 8px 24px rgba(0,0,0,0.4)'}} className="sd">
                {filteredMembers.map(m=>
                  <div key={m.id} onClick={()=>{setSelectedMember(m);setMemberSearch('');setShowMemberDrop(false);}} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:`1px solid ${T.border}`,cursor:'pointer'}} className="tap">
                    <Avatar label={m.name} uid={m.id} size={30} radius={8}/>
                    <div style={{flex:1}}>
                      <div style={{fontSize:12,fontWeight:700,color:T.fg}}>{m.name}</div>
                      <div style={{fontSize:10,color:T.muted}}>{m.phone} · {m.points} poin</div>
                    </div>
                  </div>
                )}
                <div onClick={()=>{setShowMemberDrop(false);}} style={{padding:'10px 14px',fontSize:11,fontWeight:700,color:T.indigo,cursor:'pointer',display:'flex',alignItems:'center',gap:6}} className="tap">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={T.indigo} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  New Member
                </div>
              </div>
            }
          </div>
        }

        {/* Points Redeem Toggle */}
        {selectedMember&&CHARGES.points_enabled&&selectedMember.points>=CHARGES.points_min_redeem&&
          <button onClick={()=>setRedeemPoints(!redeemPoints)} style={{marginTop:8,width:'100%',display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,border:`1px solid ${redeemPoints?'rgba(34,197,94,0.25)':T.border}`,background:redeemPoints?'rgba(34,197,94,0.06)':T.surface,cursor:'pointer',textAlign:'left'}} className="tap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={redeemPoints?T.green:T.muted} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
            <div style={{flex:1}}>
              <div style={{fontSize:11,fontWeight:800,color:redeemPoints?T.green:T.fg}}>
                {redeemPoints?`Use ${Math.floor(subtotal/CHARGES.points_redeem_rate)} points (-${fmt(pointsDiscount)})`:'Use Points'}
              </div>
              <div style={{fontSize:10,color:redeemPoints?'rgba(34,197,94,0.7)':T.muted,fontWeight:600}}>{selectedMember.points.toLocaleString()} points available</div>
            </div>
            <div style={{width:36,height:20,borderRadius:10,background:redeemPoints?T.green:T.hi,display:'flex',alignItems:'center',padding:'0 2px',justifyContent:redeemPoints?'flex-end':'flex-start',transition:'all 0.2s'}}>
              <div style={{width:16,height:16,borderRadius:8,background:'#fff'}}/>
            </div>
          </button>
        }
      </div>

      {/* Items */}
      <div style={{flex:1,overflowY:'auto',padding:'0 18px 108px'}} className="ns" onClick={()=>setShowMemberDrop(false)}>
        {cart.length===0
          ?<div style={{padding:'60px 0',textAlign:'center',color:T.muted,fontSize:11,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase'}}>Cart is empty</div>
          :cart.map((item,i)=>
            <div key={item.product.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:`1px solid ${T.border}`,animationDelay:`${i*30}ms`}} className="u">
              <Avatar label={item.product.name} uid={item.product.id+'c'} size={44} radius={10}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:700,color:T.fg,marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.product.name}</div>
                <div style={{fontSize:11,fontWeight:800,color:T.fg}}>{fmt(item.product.price)}</div>
              </div>
              <div style={{fontSize:11,fontWeight:700,color:T.muted,marginRight:4}}>{fmt(item.product.price*item.qty)}</div>
              <div style={{display:'flex',alignItems:'center',gap:2,background:T.surface,borderRadius:9,padding:3}}>
                <button onClick={()=>updateQty(item.product.id,item.qty-1)} style={{width:26,height:26,borderRadius:7,border:'none',background:'transparent',cursor:'pointer',color:T.muted,fontSize:16,fontWeight:900,display:'flex',alignItems:'center',justifyContent:'center'}} className="tap">−</button>
                <span style={{width:22,textAlign:'center',fontSize:12,fontWeight:900,color:T.fg}}>{item.qty}</span>
                <button onClick={()=>updateQty(item.product.id,item.qty+1)} style={{width:26,height:26,borderRadius:7,border:'none',background:T.fg,cursor:'pointer',color:T.bg,fontSize:16,fontWeight:900,display:'flex',alignItems:'center',justifyContent:'center'}} className="tap">+</button>
              </div>
            </div>
          )
        }
        <div style={{height:8}}/>
      </div>

      {/* Summary + CTA */}
      <div style={{padding:'12px 18px 40px',flexShrink:0,borderTop:`1px solid ${T.border}`,background:T.bg}}>
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:14,padding:'14px 16px',marginBottom:10}}>
          {[
            {l:'Subtotal',v:fmt(subtotal)},
            redeemPoints&&pointsDiscount>0?{l:'Points Discount',v:`-${fmt(pointsDiscount)}`,c:T.green}:null,
            CHARGES.tax_enabled?{l:`Tax (${CHARGES.tax_rate}%)`,v:fmt(tax)}:null,
            CHARGES.service_enabled?{l:`Service (${CHARGES.service_rate}%)`,v:fmt(service)}:null,
          ].filter(Boolean).map((row,i)=>
            <div key={i} style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
              <span style={{fontSize:11,fontWeight:600,color:row.c||T.muted}}>{row.l}</span>
              <span style={{fontSize:11,fontWeight:700,color:row.c||T.fg}}>{row.v}</span>
            </div>
          )}
          <div style={{borderTop:`1px solid ${T.border}`,marginTop:4,paddingTop:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontSize:11,fontWeight:900,color:T.fg,textTransform:'uppercase',letterSpacing:'0.1em'}}>Total</span>
            <span style={{fontSize:20,fontWeight:900,color:T.fg,letterSpacing:'-0.02em'}}>{fmt(total)}</span>
          </div>
          {earnPoints>0&&
            <div style={{marginTop:8,padding:'6px 10px',borderRadius:7,background:'rgba(34,197,94,0.06)',border:'1px solid rgba(34,197,94,0.15)',display:'flex',alignItems:'center',gap:6}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={T.green} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/></svg>
              <span style={{fontSize:10,fontWeight:700,color:T.green}}>+{earnPoints} points will be earned</span>
            </div>
          }
        </div>
        <button onClick={()=>cart.length>0&&onPayment()} disabled={cart.length===0} style={{width:'100%',height:50,borderRadius:14,background:cart.length>0?T.fg:T.surface,color:cart.length>0?T.bg:T.dim,border:'none',cursor:cart.length>0?'pointer':'not-allowed',fontSize:11,fontWeight:900,letterSpacing:'0.12em',textTransform:'uppercase'}} className="tap">
          Proceed to Payment
        </button>
      </div>
    </div>
  );
}

// ── PAYMENT ───────────────────────────────────────────────────────────────────
function PaymentScreen({cart,setCart,cartTotal,onBack,onDone,onTab}) {
  const tax=CHARGES.tax_enabled?Math.round(cartTotal*CHARGES.tax_rate/100):0;
  const total=cartTotal+tax;
  const [method,setMethod]=useState('cash');
  const [provider,setProvider]=useState('general');
  const [notes,setNotes]=useState('');
  const [proofName,setProofName]=useState(null);
  const [done,setDone]=useState(false);
  const [showReceipt,setShowReceipt]=useState(false);
  const needsProof=method==='qris'||method==='bank_transfer';

  const confirm=()=>{
    setDone(true);
    setTimeout(()=>setShowReceipt(true),900);
  };

  const closeReceipt=()=>{
    setShowReceipt(false);
    onDone();
  };

  if(done)return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:T.bg,alignItems:'center',justifyContent:'center',gap:14,padding:32,position:'relative'}}>
      <div style={{width:64,height:64,borderRadius:20,background:'rgba(34,197,94,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}} className="p">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={T.green} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div style={{fontSize:20,fontWeight:900,color:T.fg,letterSpacing:'-0.02em',textAlign:'center'}} className="u">Payment Successful</div>
      <div style={{fontSize:12,fontWeight:600,color:T.muted,textAlign:'center'}} className="u">Transaction recorded</div>
      <div style={{background:'rgba(34,197,94,0.07)',border:'1px solid rgba(34,197,94,0.18)',borderRadius:14,padding:'16px 28px',textAlign:'center',marginTop:4}} className="u">
        <div style={{fontSize:9,fontWeight:900,color:T.green,letterSpacing:'0.16em',textTransform:'uppercase',marginBottom:4}}>Amount Paid</div>
        <div style={{fontSize:24,fontWeight:900,color:T.green}}>{fmt(total)}</div>
      </div>

      {/* Receipt Bottom Sheet */}
      {showReceipt&&(
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.5)',display:'flex',alignItems:'flex-end',zIndex:50}} className="f">
          <div style={{width:'100%',background:T.surface,borderRadius:'20px 20px 0 0',padding:'8px 20px 40px'}} className="su" onClick={e=>e.stopPropagation()}>
            <div style={{width:36,height:4,borderRadius:2,background:T.border,margin:'12px auto 18px'}}/>
            {/* Receipt paper */}
            <div style={{background:'#f8f8f8',borderRadius:12,padding:'18px 16px',marginBottom:16,boxShadow:'0 2px 16px rgba(0,0,0,0.15)'}}>
              <div style={{textAlign:'center',marginBottom:12,borderBottom:'1px dashed #ddd',paddingBottom:10}}>
                <div style={{fontSize:13,fontWeight:900,color:'#111'}}>Aegis Kafe</div>
                <div style={{fontSize:9,color:'#888',marginTop:2}}>{new Date().toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})} · {new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</div>
              </div>
              <div style={{marginBottom:10}}>
                {cart.map((item,i)=>(
                  <div key={i} style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                    <span style={{fontSize:11,color:'#333'}}>{item.product.name} <span style={{color:'#888'}}>×{item.qty}</span></span>
                    <span style={{fontSize:11,fontWeight:700,color:'#111'}}>{fmt(item.product.price*item.qty)}</span>
                  </div>
                ))}
              </div>
              <div style={{borderTop:'1px dashed #ddd',paddingTop:8,marginBottom:4}}>
                {CHARGES.tax_enabled&&<div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontSize:10,color:'#888'}}>Tax ({CHARGES.tax_rate}%)</span><span style={{fontSize:10,color:'#888'}}>{fmt(tax)}</span></div>}
                <div style={{display:'flex',justifyContent:'space-between'}}>
                  <span style={{fontSize:12,fontWeight:900,color:'#111'}}>Total</span>
                  <span style={{fontSize:12,fontWeight:900,color:'#111'}}>{fmt(total)}</span>
                </div>
              </div>
              <div style={{marginTop:8,textAlign:'center'}}>
                <span style={{fontSize:9,fontWeight:700,color:'#888',textTransform:'uppercase',letterSpacing:'0.1em'}}>{method==='bank_transfer'?'Bank Transfer':method==='qris'?`QRIS · ${provider}`:method.charAt(0).toUpperCase()+method.slice(1)}</span>
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button style={{flex:1,height:46,borderRadius:12,background:T.hi,border:`1px solid ${T.border}`,color:T.fg,fontSize:11,fontWeight:800,letterSpacing:'0.08em',textTransform:'uppercase',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6}} className="tap">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Print
              </button>
              <button onClick={closeReceipt} style={{flex:2,height:46,borderRadius:12,background:T.fg,border:'none',color:T.bg,fontSize:11,fontWeight:900,letterSpacing:'0.08em',textTransform:'uppercase',cursor:'pointer'}} className="tap">
                Done → Transactions
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:T.bg}}>
      <div style={{padding:'60px 18px 14px',flexShrink:0,display:'flex',alignItems:'center',gap:12}}>
        <BackBtn onPress={onBack}/>
        <div style={{fontSize:20,fontWeight:900,color:T.fg,letterSpacing:'-0.03em'}}>Payment</div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'0 18px 24px'}} className="ns">
        {/* Total */}
        <div style={{background:'#0a0a0a',border:`1px solid ${T.border}`,borderRadius:16,padding:'20px 18px',marginBottom:16}} className="u">
          <div style={{fontSize:9,fontWeight:800,color:T.muted,letterSpacing:'0.18em',textTransform:'uppercase',marginBottom:6}}>Total Amount</div>
          <div style={{fontSize:34,fontWeight:900,color:T.fg,letterSpacing:'-0.03em',marginBottom:10}}>{fmt(total)}</div>
          {CHARGES.tax_enabled&&<div style={{fontSize:10,fontWeight:600,color:T.muted}}>Includes tax {CHARGES.tax_rate}% ({fmt(tax)})</div>}
          <div style={{display:'flex',gap:5,flexWrap:'wrap',marginTop:10}}>
            {cart.slice(0,3).map(item=>
              <div key={item.product.id} style={{display:'flex',alignItems:'center',gap:4,background:'rgba(255,255,255,0.07)',borderRadius:6,padding:'4px 9px'}}>
                <span style={{fontSize:10,fontWeight:600,color:T.muted}}>{item.product.name}</span>
                <span style={{fontSize:10,fontWeight:900,color:'rgba(240,240,240,0.4)'}}>×{item.qty}</span>
              </div>
            )}
            {cart.length>3&&<div style={{background:'rgba(255,255,255,0.07)',borderRadius:6,padding:'4px 9px'}}><span style={{fontSize:10,color:T.muted}}>+{cart.length-3} more</span></div>}
          </div>
        </div>
        {/* Method */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:9,fontWeight:800,color:T.muted,letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:8}}>Payment Method</div>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            {PAYMENT_METHODS.map(m=>
              <button key={m.id} onClick={()=>setMethod(m.id)} style={{display:'flex',alignItems:'center',gap:12,padding:'13px 14px',borderRadius:12,border:method===m.id?`1.5px solid ${T.fg}`:`1px solid ${T.border}`,background:method===m.id?'rgba(240,240,240,0.04)':T.surface,cursor:'pointer',outline:'none',textAlign:'left'}} className="tap">
                <div style={{width:34,height:34,borderRadius:8,flexShrink:0,background:method===m.id?T.fg:T.hi,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  {m.id==='cash'&&<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={method===m.id?T.bg:T.muted} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="6" width="22" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>}
                  {m.id==='debit'&&<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={method===m.id?T.bg:T.muted} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>}
                  {m.id==='qris'&&<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={method===m.id?T.bg:T.muted} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM17 17h3v3"/></svg>}
                  {m.id==='bank_transfer'&&<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={method===m.id?T.bg:T.muted} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:700,color:T.fg}}>{m.label}</div>
                  <div style={{fontSize:10,color:T.muted,fontWeight:600}}>{m.sub}</div>
                </div>
                {method===m.id&&<div style={{width:18,height:18,borderRadius:9,background:T.fg,display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke={T.bg} strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>}
              </button>
            )}
          </div>
        </div>
        {/* QRIS Provider */}
        {method==='qris'&&
          <div style={{marginBottom:14}} className="f">
            <div style={{fontSize:9,fontWeight:800,color:T.muted,letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:8}}>Provider QRIS</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
              {QRIS_PROVIDERS.map(p=>
                <button key={p.id} onClick={()=>setProvider(p.id)} style={{height:38,padding:'0 10px',borderRadius:10,border:provider===p.id?`1.5px solid ${T.amber}`:`1px solid ${T.border}`,background:provider===p.id?'rgba(245,158,11,0.08)':T.surface,color:provider===p.id?T.amber:T.muted,fontSize:11,fontWeight:800,cursor:'pointer',transition:'all 0.12s'}} className="tap">{p.label}</button>
              )}
            </div>
          </div>
        }
        {/* Proof + Notes (QRIS & Bank Transfer) */}
        {needsProof&&
          <div style={{marginBottom:14,padding:'14px',borderRadius:12,border:`1.5px dashed ${T.border}`,background:T.surface}} className="f">
            <div style={{fontSize:9,fontWeight:800,color:T.muted,letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:8}}>Payment Proof</div>
            <div onClick={()=>setProofName('bukti_transfer.jpg')} style={{height:72,borderRadius:10,border:`1px solid ${T.border}`,background:T.hi,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:5,cursor:'pointer',marginBottom:10}} className="tap">
              {proofName
                ?<><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.green} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span style={{fontSize:11,fontWeight:700,color:T.green}}>{proofName}</span></>
                :<><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.muted} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span style={{fontSize:10,fontWeight:700,color:T.muted}}>Open Camera</span></>
              }
            </div>
            <div style={{fontSize:9,fontWeight:800,color:T.muted,letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:6}}>Notes (Optional)</div>
            <input placeholder="cth: Transfer via BCA" value={notes} onChange={e=>setNotes(e.target.value)}

// ── CHATAEGIS (GlobalCommand mobile) ─────────────────────────────────────────
function AIScreen({onTab}) {
  const [messages,setMessages]=useState([{role:'assistant',text:'Halo! Tanya apa saja soal bisnis kamu, atau ketik **/** untuk lihat perintah cepat.'}]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [slashOpen,setSlashOpen]=useState(false);
  const [activeCmd,setActiveCmd]=useState(null);
  const [cmdValues,setCmdValues]=useState({});
  const endRef=useRef(null);
  const inputRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,loading]);

  const filteredCmds=input.startsWith('/')?SLASH_CMDS.filter(c=>c.key.includes(input.slice(1).toLowerCase())||c.label.toLowerCase().includes(input.slice(1).toLowerCase())):[];

  const selectCmd=cmd=>{
    setSlashOpen(false);setInput('');
    if(cmd.key==='stokmin'){
      setMessages(prev=>[...prev,{role:'user',text:cmd.label},{role:'assistant',text:'**Produk stok menipis (≤5):**\n- Tiramisu: 0 sisa\n- Club Sandwich: 5 sisa\n- Cheesecake: 6 sisa'}]);
      return;
    }
    setActiveCmd(cmd);setCmdValues({});
  };

  const runCmd=()=>{
    const label=activeCmd.label;
    const vals=Object.values(cmdValues).join(' · ');
    setActiveCmd(null);setCmdValues({});
    setMessages(prev=>[...prev,{role:'user',text:`${label}: ${vals}`}]);
    setLoading(true);
    setTimeout(()=>{
      const replies={
        stok:`✓ Stok **${cmdValues[activeCmd?.fields?.[0]?.name]||'produk'}** berhasil diupdate ke ${cmdValues[activeCmd?.fields?.[1]?.name]||'?'}.`,
        harga:`✓ Harga **${cmdValues[activeCmd?.fields?.[0]?.name]||'produk'}** berhasil diupdate ke Rp ${Number(cmdValues[activeCmd?.fields?.[1]?.name]||0).toLocaleString('id-ID')}.`,
        poin:`✓ Poin member **${cmdValues[activeCmd?.fields?.[0]?.name]||'member'}** berhasil diset ke ${cmdValues[activeCmd?.fields?.[1]?.name]||'?'}.`,
        revenue:`**Revenue ${vals}:** Rp 2.450.000 · Profit Rp 880.000 · 12 order`,
        produk:PRODUCTS.filter(p=>p.name.toLowerCase().includes((cmdValues[activeCmd?.fields?.[0]?.name]||'').toLowerCase())).map(p=>`**${p.name}** — ${fmt(p.price)} · Stok: ${p.stock}`).join('\n')||'Produk tidak ditemukan.',
        member:`**Budi Santoso** — 081234567890 · 420 poin · Rp 2.350.000 total`,
      };
      setMessages(prev=>[...prev,{role:'assistant',text:replies[label?.split(' ')[1]?.toLowerCase()]||`✓ Perintah "${label}" berhasil dijalankan.`}]);
      setLoading(false);
    },1200);
  };

  const send=()=>{
    if(!input.trim()||loading)return;
    const q=input.trim();setInput('');
    setMessages(prev=>[...prev,{role:'user',text:q}]);
    setLoading(true);
    setTimeout(()=>{
      const r=q.toLowerCase();
      let reply='Maaf, saya tidak mengerti pertanyaan tersebut. Coba ketik **/** untuk melihat perintah yang tersedia.';
      if(r.includes('revenue')||r.includes('pendapatan'))reply='**Revenue Hari Ini:** Rp 2.450.000\nProfit: Rp 880.000 · 12 transaksi · Naik 23% vs kemarin';
      else if(r.includes('stok')||r.includes('habis'))reply='**Produk stok menipis:**\n- Tiramisu: habis\n- Club Sandwich: 5 sisa\n- Cheesecake: 6 sisa';
      else if(r.includes('member'))reply='Total 48 member aktif hari ini. Member terbanyak transaksi: Budi Santoso (Rp 2.35jt), Andi Wijaya (Rp 1.9jt).';
      else if(r.includes('produk terlaris')||r.includes('best seller'))reply='**Top 3 Produk Hari Ini:**\n1. Beef Burger — 8 terjual · Rp 1.000.000\n2. Latte — 14 terjual · Rp 770.000\n3. Caesar Salad — 6 terjual · Rp 534.000';
      setMessages(prev=>[...prev,{role:'assistant',text:reply}]);
      setLoading(false);
    },1200);
  };

  const renderText=t=>t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br/>');

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:T.bg}}>
      <div style={{padding:'60px 18px 14px',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style={{fontSize:22,fontWeight:900,color:T.fg,letterSpacing:'-0.03em'}}>ChatAegis</div>
          <div style={{fontSize:10,fontWeight:600,color:T.muted,marginTop:1}}>AI Business Advisor · ketik / untuk perintah</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:8,border:`1px solid ${T.border}`,background:T.surface}}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={T.muted} strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          <span style={{fontSize:9,fontWeight:800,color:T.muted,letterSpacing:'0.08em'}}>/ PERINTAH</span>
        </div>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'0 18px 108px'}} className="ns">
        {/* Messages */}
        {messages.map((m,i)=>
          <div key={i} style={{marginBottom:12,display:'flex',flexDirection:'column',alignItems:m.role==='user'?'flex-end':'flex-start'}} className="u">
            <div style={{maxWidth:'84%',padding:'10px 14px',borderRadius:m.role==='user'?'14px 14px 4px 14px':'14px 14px 14px 4px',background:m.role==='user'?T.fg:T.surface,border:m.role==='user'?'none':`1px solid ${T.border}`}}>
              <span style={{fontSize:12,fontWeight:m.role==='user'?700:600,color:m.role==='user'?T.bg:T.fg,lineHeight:'1.55'}} dangerouslySetInnerHTML={{__html:renderText(m.text)}}/>
            </div>
          </div>
        )}
        {loading&&
          <div style={{marginBottom:12,display:'flex'}}>
            <div style={{padding:'12px 16px',borderRadius:'14px 14px 14px 4px',background:T.surface,border:`1px solid ${T.border}`,display:'flex',gap:4,alignItems:'center'}}>
              <span className="dot1"/><span className="dot2"/><span className="dot3"/>
            </div>
          </div>
        }

        {/* Active command form */}
        {activeCmd&&
          <div style={{marginBottom:12,padding:'14px',borderRadius:12,border:`1px solid ${T.indigo}33`,background:'rgba(129,140,248,0.04)'}} className="sd">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <span style={{fontSize:12,fontWeight:800,color:T.fg}}>/{activeCmd.key} — {activeCmd.label}</span>
              <button onClick={()=>setActiveCmd(null)} style={{fontSize:11,fontWeight:700,color:T.muted,background:'none',border:'none',cursor:'pointer'}}>ESC</button>
            </div>
            {activeCmd.fields.map((f,i)=>
              <div key={f.name} style={{marginBottom:8}}>
                <div style={{fontSize:9,fontWeight:800,color:T.muted,letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:4}}>{f.label}</div>
                {'options' in f
                  ?<div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                      {f.options.map(opt=><button key={opt} onClick={()=>setCmdValues(v=>({...v,[f.name]:opt}))} style={{height:30,padding:'0 10px',borderRadius:7,border:`1px solid ${cmdValues[f.name]===opt?T.fg:T.border}`,background:cmdValues[f.name]===opt?T.fg:'transparent',color:cmdValues[f.name]===opt?T.bg:T.muted,fontSize:11,fontWeight:700,cursor:'pointer',transition:'all 0.12s'}} className="tap">{opt}</button>)}
                    </div>
                  :<input value={cmdValues[f.name]||''} onChange={e=>setCmdValues(v=>({...v,[f.name]:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&runCmd()} placeholder={f.placeholder}
                      style={{width:'100%',height:38,borderRadius:9,border:`1px solid ${T.border}`,background:T.hi,padding:'0 12px',fontSize:12,fontWeight:600,color:T.fg,outline:'none'}} autoFocus={i===0}/>
                }
              </div>
            )}
            <button onClick={runCmd} style={{width:'100%',height:38,borderRadius:9,background:T.fg,color:T.bg,border:'none',cursor:'pointer',fontSize:11,fontWeight:900,letterSpacing:'0.1em',textTransform:'uppercase',marginTop:4}} className="tap">Jalankan</button>
          </div>
        }
        <div ref={endRef}/>
      </div>

      {/* Slash dropdown — floating above input, outside scroll area */}
      {slashOpen&&filteredCmds.length>0&&
        <div style={{margin:'0 18px',marginBottom:6,borderRadius:12,border:`1px solid ${T.border}`,background:T.surface,overflow:'hidden',boxShadow:'0 -4px 20px rgba(0,0,0,0.4)',flexShrink:0}} className="sd">
          {filteredCmds.map((c,i)=>
            <div key={c.key} onClick={()=>selectCmd(c)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderTop:i>0?`1px solid ${T.border}`:'none',cursor:'pointer'}} className="tap">
              <span style={{fontSize:11,fontWeight:900,color:T.indigo,fontFamily:'monospace',width:90,flexShrink:0}}>/{c.key}</span>
              <span style={{fontSize:11,fontWeight:700,color:T.fg,flex:1}}>{c.label}</span>
            </div>
          )}
        </div>
      }

      <div style={{padding:'10px 18px 14px',flexShrink:0,display:'flex',gap:8}}>
        <input ref={inputRef} value={input} onChange={e=>{const v=e.target.value;setInput(v);setSlashOpen(v.startsWith('/'));}} onKeyDown={e=>{if(e.key==='Enter')send();}} placeholder="Tanya Aegis... atau ketik / untuk command"
          style={{flex:1,height:44,borderRadius:12,border:`1px solid ${T.border}`,background:T.surface,padding:'0 14px',fontSize:12,fontWeight:600,color:T.fg,outline:'none'}}/>
        <button onClick={send} style={{width:44,height:44,borderRadius:12,background:input.trim()?T.fg:T.surface,border:'none',cursor:input.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',transition:'all 0.15s',flexShrink:0}} className="tap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke={input.trim()?T.bg:T.muted} strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div style={{height:100,flexShrink:0}}/>
      <BottomNav active="ai" onTab={onTab}/>
    </div>
  );
}

              <div key={day.l} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>

              </div>
              {ORDERS.map((o,i)=><React.Fragment key={o.id}>
                <div style={{display:'grid',gridTemplateColumns:'1fr auto auto',background:i%2===0?'transparent':'rgba(0,0,0,0.02)',borderTop:'1px solid rgba(0,0,0,0.06)'}}>

                    <div style={{fontSize:10,fontWeight:700,color:'#222'}}>{o.member}</div>
                    <div style={{fontSize:9,color:'#888',fontFamily:'monospace'}}>{o.id} · {o.time}</div>

                  <div style={{padding:'8px 10px',display:'flex',alignItems:'center',justifyContent:'flex-end'}}>

                  </div>

        </div>
        <div style={{height:8}}/>
      </div>
      <BottomNav active="home" onTab={onTab}/>

  );
}

// ── SETTINGS HELPERS (module-level so React doesn't remount on state change) ──
function SToggle({on,setOn}) {
  return(
    <div onClick={()=>setOn(!on)} style={{width:42,height:24,borderRadius:12,background:on?T.green:T.hi,display:'flex',alignItems:'center',padding:'0 2px',justifyContent:on?'flex-end':'flex-start',cursor:'pointer',transition:'all 0.2s',flexShrink:0}}>
      <div style={{width:20,height:20,borderRadius:10,background:'#fff',boxShadow:'0 1px 4px rgba(0,0,0,0.3)'}}/>
    </div>
  );
}
function SRow({label,sub,right,last}) {
  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,padding:'13px 0',borderBottom:last?'none':`1px solid ${T.border}`}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:12,fontWeight:700,color:T.fg}}>{label}</div>
        {sub&&<div style={{fontSize:10,color:T.muted,fontWeight:600,marginTop:2}}>{sub}</div>}
      </div>
      {right}
    </div>
  );
}
function SInputRow({label,sub,value,onChange,prefix,last}) {
  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,padding:'12px 0',borderBottom:last?'none':`1px solid ${T.border}`}}>
      <div style={{flex:1}}>
        <div style={{fontSize:12,fontWeight:700,color:T.fg}}>{label}</div>
        {sub&&<div style={{fontSize:10,color:T.muted,fontWeight:600,marginTop:2}}>{sub}</div>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
        {prefix&&<span style={{fontSize:11,fontWeight:700,color:T.muted}}>{prefix}</span>}
        <input value={value} onChange={e=>onChange(e.target.value)} inputMode="numeric" style={{width:64,height:34,borderRadius:8,border:`1px solid ${T.border}`,background:T.hi,padding:'0 8px',fontSize:13,fontWeight:900,color:T.fg,outline:'none',textAlign:'right'}}/>
      </div>
    </div>
  );
}
function STextRow({label,value,onChange,last,placeholder}) {
  return(
    <div style={{padding:'12px 0',borderBottom:last?'none':`1px solid ${T.border}`}}>
      <div style={{fontSize:10,fontWeight:700,color:T.muted,marginBottom:6}}>{label}</div>
      <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder||''} style={{width:'100%',height:38,borderRadius:9,border:`1px solid ${T.border}`,background:T.hi,padding:'0 12px',fontSize:12,fontWeight:600,color:T.fg,outline:'none'}}/>
    </div>
  );
}
function SSection({title,children}) {
  return(
    <div style={{marginBottom:12}}>
      <div style={{fontSize:9,fontWeight:800,color:T.muted,letterSpacing:'0.18em',textTransform:'uppercase'}}>{title}</div>
      <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:16,padding:'0 16px',marginTop:8}}>{children}</div>
    </div>
  );
}

          <button style={{width:'100%',height:48,borderRadius:14,background:T.fg,color:T.bg,border:'none',cursor:'pointer',fontSize:12,fontWeight:900,letterSpacing:'0.1em',textTransform:'uppercase'}} className="tap">Save Changes</button>
        </div>
        <div style={{height:8}}/>
      </div>
      <BottomNav active="home" onTab={onTab}/>
    </div>
  );

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab,setTab]=useState('home');
  const phoneW=390,phoneH=844;

  useEffect(()=>{
    const scale=()=>{
      const el=document.getElementById('phone-wrap');if(!el)return;
      const s=Math.min(window.innerWidth/phoneW,window.innerHeight/phoneH)*.96;
      el.style.transform=`scale(${s})`;
    };
    scale();window.addEventListener('resize',scale);return()=>window.removeEventListener('resize',scale);
  },[]);

  const screens={home:HomeScreen,pos:POSScreen,orders:OrdersScreen,ai:AIScreen,products:ProductsScreen,members:MembersScreen,laporan:LaporanScreen,settings:SettingsScreen,updates:FeatureUpdatesScreen,integrations:IntegrationsScreen,mcp:MCPServerScreen};
  const Screen=screens[tab]||HomeScreen;

  return(
    <div id="phone-wrap">
      <div style={{width:phoneW,height:phoneH,background:T.bg,borderRadius:50,overflow:'hidden',boxShadow:'0 0 0 12px #1a1a1a,0 0 0 13px rgba(255,255,255,0.06),0 40px 80px rgba(0,0,0,0.7)',position:'relative'}}>
        <div style={{position:'absolute',top:14,left:'50%',transform:'translateX(-50%)',width:120,height:32,background:'#000',borderRadius:20,zIndex:30}}/>
        {/* Top scrim — masks border-radius bleed at top edge */}
        <div style={{position:'absolute',top:0,left:0,right:0,height:52,background:`linear-gradient(to bottom,${T.bg} 36px,transparent)`,zIndex:19,pointerEvents:'none'}}/>
        <Screen onTab={setTab}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
